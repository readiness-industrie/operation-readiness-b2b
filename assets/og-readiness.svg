<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Readiness Industry — service de poursuite des prérequis</title>
  <desc id="desc">Vous gardez les décisions. Nous prenons les relances, les preuves et la traçabilité.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10202b"/>
      <stop offset="1" stop-color="#234451"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0v48" fill="none" stroke="#fff" stroke-opacity=".045"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <g transform="translate(80 78)">
    <path d="M0 4h42M0 18h30M0 32h18" fill="none" stroke="#ef8b60" stroke-width="6" stroke-linecap="round"/>
    <text x="60" y="25" fill="#fff" font-family="Arial, sans-serif" font-size="24" font-weight="700">Readiness Industry</text>
  </g>
  <text x="80" y="210" fill="#ef8b60" font-family="Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="3">PRÉPARATION D'INTERVENTION INDUSTRIELLE</text>
  <text x="80" y="290" fill="#fff" font-family="Arial, sans-serif" font-size="50" font-weight="700">Vous gardez les décisions.</text>
  <text x="80" y="360" fill="#b9c7cc" font-family="Arial, sans-serif" font-size="45" font-weight="700">Nous prenons les relances et les preuves.</text>
  <g transform="translate(80 455)">
    <rect width="310" height="82" rx="12" fill="#f6f4ee"/>
    <circle cx="42" cy="41" r="9" fill="#2e6b54"/>
    <text x="68" y="48" fill="#10202b" font-family="Arial, sans-serif" font-size="22" font-weight="700">Preuve obtenue</text>
    <rect x="330" width="310" height="82" rx="12" fill="#f6f4ee"/>
    <circle cx="372" cy="41" r="9" fill="#675779"/>
    <text x="398" y="48" fill="#10202b" font-family="Arial, sans-serif" font-size="22" font-weight="700">À valider</text>
    <rect x="660" width="370" height="82" rx="12" fill="#f6f4ee"/>
    <circle cx="702" cy="41" r="9" fill="#9b681e"/>
    <text x="728" y="48" fill="#10202b" font-family="Arial, sans-serif" font-size="22" font-weight="700">Blocage escaladé</text>
  </g>
</svg>
