{% extends 'operations/base.html' %}
{% block title %}{{ title }} — Readiness Console{% endblock %}
{% block content %}
<div class="narrow-page"><p class="back-link">{% if mission %}<a href="{% url 'mission_detail' mission.id %}">← Retour à la mission</a>{% else %}<a href="{% url 'dashboard' %}">← Retour</a>{% endif %}</p><section class="card form-card"><p class="eyebrow">Saisie opérateur</p><h1>{{ title }}</h1><form method="post" enctype="multipart/form-data" class="stack-form">{% csrf_token %}{{ form.as_div }}<button class="button primary" type="submit">{{ submit_label|default:'Enregistrer' }}</button></form></section></div>
{% endblock %}
