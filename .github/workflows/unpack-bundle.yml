name: Unpack site bundle

on:
  push:
    branches:
      - publish-site
    paths:
      - ".bundle/READY"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Rebuild and unpack site
        shell: bash
        run: |
          set -euo pipefail
          cat .bundle/part-* > /tmp/site.zip.b64
          base64 -d /tmp/site.zip.b64 > /tmp/site.zip
          rm -rf /tmp/unpack
          mkdir -p /tmp/unpack
          unzip -q /tmp/site.zip -d /tmp/unpack
          cp -a /tmp/unpack/operation-readiness-b2b/. .
          sed -i 's#https://hervemengue-dot.github.io/operation-readiness-b2b/#https://readiness-industrie.github.io/operation-readiness-b2b/#g' README.md index.html
          rm -rf .bundle
          rm -f .github/workflows/unpack-bundle.yml

      - name: Commit unpacked site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Publish Operation Readiness B2B site"
          git push origin HEAD:publish-site
