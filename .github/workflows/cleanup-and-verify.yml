name: Verify and clean published site

on:
  push:
    branches:
      - publish-site
    paths:
      - ".cleanup/READY"

permissions:
  contents: write

jobs:
  verify-clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify site and clean temporary files
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f simulation-data.js
          test -f .nojekyll
          grep -q 'readiness-industrie.github.io/operation-readiness-b2b/' index.html
          if grep -q 'hervemengue-dot.github.io/operation-readiness-b2b/' index.html; then
            echo 'Old GitHub URL still present in index.html' >&2
            exit 1
          fi
          rm -f .publish-check CNAME
          rm -rf .cleanup
          rm -f .github/workflows/cleanup-and-verify.yml

      - name: Commit verified site state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Verify and clean published site"
          git push origin HEAD:publish-site
