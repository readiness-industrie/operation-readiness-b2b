name: Final clean

on:
  push:
    branches:
      - publish-site
    paths:
      - ".final-clean/READY"

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Verify and clean
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f simulation-data.js
          test -f .nojekyll
          grep -q 'readiness-industrie.github.io/operation-readiness-b2b/' index.html
          ! grep -q 'hervemengue-dot.github.io/operation-readiness-b2b/' index.html
          rm -f .publish-check .pr-marker CNAME
          rm -rf .cleanup .final-clean .bundle
          rm -f .github/workflows/unpack-bundle.yml .github/workflows/cleanup-and-verify.yml .github/workflows/final-clean.yml
      - name: Commit clean state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Finalize published site"
          git push origin HEAD:publish-site
