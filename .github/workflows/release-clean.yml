name: Release clean

on:
  push:
    branches:
      - publish-site
    paths:
      - ".release/READY"

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate release tree
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html styles.css app.js simulation-data.js .nojekyll README.md; do test -f "$f"; done
          test -d assets
          grep -q 'readiness-industrie.github.io/operation-readiness-b2b/' index.html
          ! grep -q 'hervemengue-dot.github.io/operation-readiness-b2b/' index.html
          rm -f .publish-check .pr-marker .status-note CNAME
          rm -rf .bundle .cleanup .final-clean .release
          rm -f .github/workflows/unpack-bundle.yml .github/workflows/cleanup-and-verify.yml .github/workflows/final-clean.yml .github/workflows/release-clean.yml
      - name: Commit release tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Prepare site release"
          git push origin HEAD:publish-site
