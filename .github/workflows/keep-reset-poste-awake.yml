name: Garder reset-poste éveillé

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Réveiller le site et lire robots.txt
        shell: bash
        run: |
          set +e
          ping_url() {
            url="$1"
            dest="$2"
            code="000"
            attempt=1
            while [ "$attempt" -le 3 ]; do
              echo "Tentative ${attempt}/3 : ${url}"
              code="$(curl -sS -L --max-time 60 -o "$dest" -w "%{http_code}" "$url")"
              curl_status=$?
              if [ "$curl_status" -eq 0 ] && [ -n "$code" ] && [ "$code" != "000" ]; then
                break
              fi
              echo "Échec curl (statut ${curl_status}, HTTP ${code:-000}) : ${url}"
              if [ "$attempt" -eq 3 ]; then
                break
              fi
              attempt=$((attempt + 1))
              sleep 5
            done
            echo "HTTP ${code:-000} ${url}"
          }

          ping_url "https://reset-poste.onrender.com/" /tmp/reset-poste-home.body
          ping_url "https://reset-poste.onrender.com/robots.txt" /tmp/reset-poste-robots.txt
          echo "----- robots.txt (3 premières lignes) -----"
          if [ -s /tmp/reset-poste-robots.txt ]; then
            head -n 3 /tmp/reset-poste-robots.txt
          else
            echo "(corps vide ou indisponible)"
          fi
          exit 0
