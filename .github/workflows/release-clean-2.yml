name: Release clean 2

on:
  push:
    branches:
      - publish-site
    paths:
      - ".release2/READY"

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate and clean
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html styles.css app.js simulation-data.js .nojekyll README.md; do test -f "$f"; done
          test -d assets
          grep -q 'readiness-industrie.github.io/operation-readiness-b2b/' index.html
          ! grep -q 'hervemengue-dot.github.io/operation-readiness-b2b/' index.html
          rm -f .publish-check .pr-marker .status-note .release-wait CNAME
          rm -rf .bundle .cleanup .final-clean .release .release2
          rm -f .github/workflows/unpack-bundle.yml .github/workflows/cleanup-and-verify.yml .github/workflows/final-clean.yml .github/workflows/release-clean.yml .github/workflows/release-clean-2.yml
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Finalize release tree"
          git push origin HEAD:publish-site
