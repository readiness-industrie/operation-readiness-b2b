<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Assistant Readiness Industry</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f4f6f9}*{box-sizing:border-box}body{margin:0}.app{max-width:900px;margin:auto;padding:16px 14px 50px}header{padding:12px 4px 18px}h1{margin:0 0 6px;font-size:28px}header p{margin:0;color:#687386}.card{background:#fff;border:1px solid #e0e5ec;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 5px 18px #1018280a}label{font-weight:750;font-size:14px;display:block;margin:10px 0 7px}input,textarea,select{width:100%;padding:11px;border:1px solid #d4dae3;border-radius:11px;font:inherit;background:#fff}textarea{min-height:160px;resize:vertical}button{border:0;border-radius:12px;padding:12px 15px;font:700 15px inherit;background:#172033;color:#fff;cursor:pointer}button:disabled{opacity:.5}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.kpi{background:#f7f9fc;border-radius:11px;padding:12px}.kpi b{font-size:22px;display:block}.muted,.small{color:#687386;font-size:13px}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#eef2f7;font-size:12px;font-weight:750}.high{background:#fff0e8}.blocked{background:#ffe8e8}.valid{background:#fff5dc}.closed{background:#eaf7ee}.dossier{border:1px solid #e1e6ed;border-radius:14px;padding:13px;margin:9px 0}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.point{padding:10px 0;border-top:1px solid #edf0f4}.pointControls{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.pointControls input,.pointControls select{padding:8px;font-size:12px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.actions button{font-size:12px;padding:8px 10px}.banner{background:#fff3ef;border:1px solid #e5b2a9;border-radius:13px;padding:12px;margin-top:10px;font-weight:700}.result{line-height:1.5}.section{border-top:1px solid #edf0f4;margin-top:13px;padding-top:12px}.section h3{font-size:16px;margin:0 0 7px}.pointgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.resultPoint{background:#f7f9fc;border-radius:11px;padding:11px}.hidden{display:none}@media(max-width:650px){.grid,.pointgrid{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}}
</style></head>
<body><main class="app">
<header><span class="pill">V0.1 · Readiness Industry</span><h1>Assistant Readiness</h1><p>Qualifier → points ouverts → relances → preuves → validation → clôture.</p></header>
<section class="card"><h2>1. Nouveau dossier</h2><div class="grid"><div><label>Entreprise</label><input id="client" placeholder="Nom de l'entreprise"></div><div><label>Projet</label><input id="projet" placeholder="Installation / SAT / mise en service"></div></div>
<label>Demande, mail, compte rendu ou informations du prospect</label><textarea id="text" placeholder="Colle ici le contenu reçu. Ne complète pas les informations absentes."></textarea>
<button id="analyze">Analyser et créer le dossier</button><div id="status" class="muted"></div></section>
<section class="card"><div class="row"><div><span class="pill">Cockpit Readiness</span><h2 style="margin:7px 0 0">Dossiers</h2></div><button id="refresh">Actualiser</button><button id="new">Nouveau</button></div><div id="sync" class="muted">Chargement…</div><div id="kpis" class="kpis" style="margin-top:10px"></div><div id="list" style="margin-top:10px"></div></section>
<section class="card hidden" id="result"></section>
</main>
<script>
const $=function(id){return document.getElementById(id)};let items=[];
const esc=function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
const pill=function(s){var c=s==="Haute"?"high":s==="Bloquée"?"blocked":s==="À valider"?"valid":s==="Terminé"?"closed":"";return '<span class="pill '+c+'">'+esc(s)+'</span>'};
async function api(path,opt){opt=opt||{};var h={"Content-Type":"application/json"};var r=await fetch(path,Object.assign({},opt,{headers:h}));var d=await r.json();if(!r.ok)throw Error(d.error||"Erreur");return d}
function render(){
 var total=items.length,val=items.filter(function(x){return x.etat==="À valider"}).length,high=items.filter(function(x){return x.priorite==="Haute"}).length,done=items.filter(function(x){return x.etat==="Terminé"}).length,blocked=items.reduce(function(n,x){return n+x.points.filter(function(p){return p.statut==="Bloqué"}).length},0),proofs=items.reduce(function(n,x){return n+x.points.filter(function(p){return p.preuve_controle!=="Contrôlée"}).length},0),follow=items.reduce(function(n,x){return n+(x.relances||[]).length},0);
 $("kpis").innerHTML=[["Dossiers",total],["À valider",val],["Priorité haute",high],["Terminés",done],["Bloqués",blocked],["Preuves à contrôler",proofs],["Relances",follow]].map(function(x){return '<div class="kpi"><b>'+x[1]+'</b><span class="small">'+x[0]+'</span></div>'}).join("");
 $("list").innerHTML=items.length?items.map(function(x){return '<article class="dossier"><div class="row"><strong>'+esc(x.client)+' · '+esc(x.projet)+'</strong>'+pill(x.etat)+'</div><div class="small" style="margin-top:5px">Jalon : '+esc(x.jalon)+' '+(x.date_jalon?'· '+esc(x.date_jalon):"")+' · '+pill(x.priorite)+'</div><div style="margin-top:9px"><strong>Prochaine action :</strong> '+esc(x.prochaine_action)+'</div><div class="pointgrid" style="margin-top:9px">'+x.points.map(function(p){return '<div class="resultPoint"><div class="row"><strong>'+esc(p.categorie)+'</strong>'+pill(p.statut)+'</div><div class="small" style="margin-top:5px">'+esc(p.action)+'</div><div class="small" style="margin-top:4px">Preuve : '+esc(p.preuve_attendue)+'</div><div class="small" style="margin-top:4px">Responsable : '+esc(p.responsable)+' · Échéance : '+esc(p.echeance)+'</div><div class="pointControls"><select id="st-'+p.id+'"><option>À vérifier</option><option>À faire</option><option>En cours</option><option>À valider</option><option>Bloqué</option><option>Clos</option></select><input id="resp-'+p.id+'" placeholder="Responsable" value="'+esc(p.responsable)+'"><input id="due-'+p.id+'" placeholder="Échéance" value="'+esc(p.echeance)+'"><input id="proof-'+p.id+'" placeholder="Preuve reçue"><select id="pc-'+p.id+'"><option>À contrôler</option><option>Contrôlée</option><option>Insuffisante</option></select></div><div class="actions"><button onclick="savePoint(\''+x.id+'\',\''+p.id+'\')">Enregistrer le point</button></div></div>'}).join("")+'</div><div class="banner">Validation humaine requise avant clôture.</div><div class="section"><h3>Relances à préparer</h3>'+(x.relances||[]).map(function(r){return '<div class="point"><strong>'+esc(r.categorie)+'</strong><br><span class="small">'+esc(r.demande)+' · Preuve : '+esc(r.preuve_attendue)+' · <b>'+esc(r.statut)+'</b></span></div>'}).join('')+'</div><div class="actions"><button onclick="setState(\''+x.id+'\',\'En cours\')">Passer en cours</button><button onclick="setState(\''+x.id+'\',\'En attente\')">Mettre en attente</button><button onclick="setState(\''+x.id+'\',\'À valider\')">À valider</button><button onclick="validateDossier(\''+x.id+'\')">Valider avec Hervé</button></div></article>'}).join(""):"<div class='muted'>Aucun dossier.</div>";
 $("sync").textContent="Cockpit synchronisé côté serveur. Ce n’est pas une maquette locale.";
}
async function load(){try{items=(await api("/api/dashboard")).items;render()}catch(e){$("sync").textContent="Cockpit indisponible : "+e.message}}
async function savePoint(did,pid){try{var b={statut:document.getElementById("st-"+pid).value,responsable:document.getElementById("resp-"+pid).value,echeance:document.getElementById("due-"+pid).value,preuve_recue:document.getElementById("proof-"+pid).value,preuve_controle:document.getElementById("pc-"+pid).value};await api("/api/dashboard/"+did+"/points/"+pid,{method:"PATCH",body:JSON.stringify(b)});await load()}catch(e){alert(e.message)}}
async function validateDossier(id){try{await api("/api/dashboard/"+id,{method:"PATCH",body:JSON.stringify({validation_humaine_requise:false,confirmation:"Hervé",etat:"Terminé"})});await load()}catch(e){alert(e.message)}}
async function setState(id,etat){try{await api("/api/dashboard/"+id,{method:"PATCH",body:JSON.stringify({etat:etat})});await load()}catch(e){alert(e.message)}}
$("refresh").onclick=load; $("new").onclick=function(){ $("client").value=""; $("projet").value=""; $("text").value=""; $("result").classList.add("hidden"); $("status").textContent=""; window.scrollTo({top:0,behavior:"smooth"}); };
$("analyze").onclick=async function(){var text=$("text").value.trim();if(!text){$("status").textContent="Colle d'abord le contenu du dossier.";return}$("analyze").disabled=true;$("status").textContent="Analyse locale en cours…";try{var d=await api("/api/analyze",{method:"POST",body:JSON.stringify({text:text,client:$("client").value.trim(),projet:$("projet").value.trim()})}),a=d.analysis;$("result").classList.remove("hidden");$("result").innerHTML='<div class="result"><span class="pill valid">À valider avec Hervé</span><h2>Lecture du dossier</h2><p><strong>Jalon :</strong> '+esc(a.jalon)+' '+(a.date_jalon?'· '+esc(a.date_jalon):"")+'</p><p>'+esc(a.resume)+'</p><div class="section"><h3>Points détectés</h3>'+a.points.map(function(p){return '<div class="point"><strong>'+esc(p.categorie)+'</strong> · '+esc(p.statut)+'<br><span class="small">'+esc(p.action)+' Preuve attendue : '+esc(p.preuve_attendue)+'</span></div>'}).join("")+'</div><div class="section"><h3>Prochaine action</h3><p>'+esc(a.prochaine_action)+'</p></div><div class="banner">Je ne peux pas considérer le dossier comme sécurisé sur la seule base du texte fourni. Les responsables, échéances, preuves et validations doivent être confirmés.</div></div>';await load();$("status").textContent="Dossier créé dans le cockpit."}catch(e){$("status").textContent=e.message}finally{$("analyze").disabled=false}};
load();
</script></body></html>
